extractor:
  image_size_px: 224
  field_of_view_degrees: 8.0
  num_orientations: 8
  phases: [0.0, 1.57079632679]
  frequency_sampling:
    policy: logspace
    min_cpd: 0.5
    max_cpd: 12.0
    num_frequencies: 6

metric:
  alpha: 0.3
  beta: 0.7

attack:
  steps: 15
  step_size: 0.005
  lambda_v1: 2.0
  random_start: true
  pixel_guardrail_eps: 0.03

demo:
  seed: 0
  device: cpu
  output_dir: research/v1_metric_pipeline/outputs/demo
  model_num_classes: 10
