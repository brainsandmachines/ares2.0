extractor:
  image_size_px: 224
  field_of_view_degrees: 8.0
  num_orientations: 8
  phases: [0.0, 1.57079632679]
  frequency_sampling:
    policy: logspace
    min_cpd: 0.5
    max_cpd: 12.0
    num_frequencies: 6

metric:
  alpha: 0.3
  beta: 0.7

attack:
  steps: 10
  step_size: 0.004
  lambda_v1: 1.0
  random_start: true
  random_start_eps: 0.01
  pixel_guardrail_eps: 0.03
  shrink_back_enabled: false

train:
  seed: 0
  device: cpu
  batch_size: 8
  image_size_px: 224
  num_classes: 10
  dataset_size: 128
  epochs: 1
  max_batches_per_epoch: 10
  lr: 0.001
