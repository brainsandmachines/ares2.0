# Main Hydra config. It composes the specific group configs below.
defaults:
  - lr_scheduler: cosine
  - model: convnext_small
  - dataset: imagenet
  - optimizer: adamw
  - attacks: adv
  - continuation: default
  - epsilon_schedule: default
  - checkpointing: default
  - dist: default
  - training: convnext_small
  - _self_


# Training / schedule / augmentation / misc settings split from convnext_small.yaml
# amp parameters
apex_amp: False
native_amp: True

# misc
seed: null
log_interval: 50
recovery_interval: 0
num_workers: 6
output_dir: 'results/models'
save_log: save_log.txt
eval_metric: top1
pin_mem: True

# final evaluation (AutoAttack + PGD sweep)
# Default OFF: a plain run does adversarial training only. The orchestrator's
# AA_SWEEP stage explicitly turns this on (final_eval=True final_eval_autoattack=True).
# final_eval_aatype controls how much of the AA grid runs: "eps_norm" (default)
# tests only the norm/eps the model was actually trained on; pass
# final_eval_aatype=full_sweep to run the old linf/l2/l1 x eps_inputs grid.
final_eval: True
final_eval_ckpt_name: model_best.pth.tar
final_eval_autoattack: True
final_eval_aatype: eps_norm
final_eval_aa_batch_size: 128
final_eval_aa_norm: null
final_eval_aa_eps: null
final_eval_aa_max_batches: 8
final_eval_aa_eps_inputs: 1,2,4,6,8,12
final_eval_aa_completion_csv: autoattack_sweep_results.csv
final_eval_aa_checkpoint_kinds: best,last,advbest
final_eval_pgd: False
final_eval_pgd_eps: 1,2,4,6,8,12
final_eval_pgd_norms: linf,l2,l1
final_eval_pgd_attack_steps: 10
final_eval_pgd_batch_size: 192
final_eval_pgd_max_batches: null
final_eval_pgd_completion_csv: pgd_validation_results.csv
final_eval_skip_if_complete: True
final_eval_require_train_this_run: False
final_eval_plots: True
final_eval_plot_x_col: pgd_constrained_eps
final_eval_out_dir: pgd_eval
final_eval_val_dir: ''
final_eval_num_workers: 8

# runtime probe (capped-batch 1-epoch timing inspection -> shared CSV)
runtime_probe: False
runtime_probe_csv: ''
runtime_probe_protocol: ''
runtime_probe_arch: ''
runtime_probe_warmup_batches: 5
runtime_probe_measure_batches: 20
