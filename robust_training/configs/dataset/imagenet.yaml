# Dataset settings for ImageNet
train_dir: '/groups/golan_neurogroup/bml_group/datasets/imagenet/train/'
eval_dir: '/groups/golan_neurogroup/bml_group/datasets/imagenet/val/'
grad_accum: 1
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
scale: [0.08, 1.0]
ratio: [0.75, 1.3333]
hflip: True
vflip: False

# augmentation
no_aug: False
color_jitter: 0
aa: rand-m9-mstd0.5-inc1
aug_repeats: 0
aug_splits: 0
jsd_loss: False
reprob: 0
remode: pixel
recount: 1
resplit: False

input_size: 224
crop_pct: 0.875
interpolation: bicubic
train_interpolation: bicubic

mixup_active: true
mixup: 0.8
cutmix: 1.0
cutmix_minmax: null
mixup_prob: 0.5
mixup_switch_prob: 0.5
mixup_mode: elem
mixup_off_epoch: 175
smoothing: 0.1

# Developmental Visual Diet (DVD) training curriculum.
# Disabled by default. When enabled, DVD is applied to train batches on GPU
# before adversarial example generation.
dvd:
  enabled: false
  backend: scale_free
  variant: dvd-b
  months_per_epoch: null
  time_order: chronological
  apply_blur: true
  apply_color: true
  apply_contrast: true
  apply_threshold_color: false
  image_size: null
  cs_logspan_start: 0.005
  contrast_amplitude_beta: 0.0001
  contrast_amplitude_lam: 150.0
