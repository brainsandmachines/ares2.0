# Adversarial / attack related defaults
advtrain: True
attack_criterion: madry # madry / trades
attack_norm: linf # l2 / linf / l1
advprop: False
attack_eps: 1.0
attack_step: 1.0
attack_it: 3
attack_random_start: True # only used for validation
bce_loss: False

random_start: False
random_start_eps_factor: 0.5

# L1 attack step controls
# - l2_norm: legacy baseline (g / ||g||2)
# - l1_apgd: top-k sparse sign updates with L1 projection
l1_step_mode: l2_norm
l1_apgd_rho: 0.05
l1_apgd_use_halving: True
l1_apgd_min_step_scale: 0.01

# TRADES related defaults
trades_beta: 1.0


# GradNorm related defaults
gradnorm: False
loss_fn: 'DBP'
ce_weight: 0.8
gradnorm_weight: 1.2
alpha: [0.0, 0.2, 1.0]
alpha_start_epoch: 0
alpha_scale_init: 0.1
alpha_scale_epochs: 9
gradnorm_max_reg_to_ce_ratio: 3.0
