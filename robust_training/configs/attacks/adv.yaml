# Adversarial / attack related defaults
advtrain: True
attack_criterion: madry # madry / trades
attack_norm: linf # l2 / linf / l1
attack_domain: pixel # pixel / v1_feature
advprop: False
attack_eps: 1.0
attack_step: null
attack_it: 3
attack_random_start: True # only used for validation
attack_use_best: True
bce_loss: False

v1_attack_eps: 1.0
v1_attack_step: null
v1_attack_it: 3
v1_attack_random_start: False
v1_attack_use_best: True

random_start: False
random_start_eps_factor: 0.5

# L1 attack step controls
# - l2_norm: legacy baseline (g / ||g||2)
# - l1_apgd: top-k sparse sign updates with L1 projection
l1_step_mode: l2_norm
l1_apgd_rho: 0.05
l1_apgd_use_halving: True
l1_apgd_min_step_scale: 0.01

# TRADES related defaults
trades_beta: 1.0


# GradNorm related defaults
gradnorm: False
loss_fn: 'DBP'
# current: CE + capped(alpha * DBP)
# weighted: ce_weight * CE + capped_or_uncapped(gradnorm_weight * alpha * DBP)
gradnorm_objective: current
ce_weight: 0.8
gradnorm_weight: 1.2
# In gradnorm_l1_<EPS> job names, l1 is the DBP penalty norm and EPS is a
# linf-style pixel epsilon, not L1 adversarial training.
gradnorm_penalty_norm: l1
alpha: [0.0, 0.2, 1.0]
alpha_start_epoch: 0
alpha_scale_init: 0.1
alpha_scale_epochs: 9
# Set to 0 to disable the regularizer-to-CE cap.
gradnorm_max_reg_to_ce_ratio: 1.0
