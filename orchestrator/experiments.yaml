# Experiment queue seed list (version-controlled, edited on botero).
#
# Each entry becomes one row in models_queue. model_id defaults to job_name
# (unique). model_dir is derived deterministically for non-v1 small models as
#   {models_root}/convnext_small_<job_name>
# matching parse_train_job / parse_cont_train_job in sbatches/*launcher*.sh.
# For v1 / base / large models, set `model_dir:` explicitly on the entry.
#
# total scheduled epochs = warmup_epochs + linear_epochs + plateau_epochs
#   standard training (fixed eps):   0 / 0 / 150            (150 total; bump to add more)
#   continuation:                    4 / 21 / 15            (40 total; warmup→ramp ends ep25→plateau)
#
# arch / protocol / eps are descriptive columns. They are AUTO-DERIVED from the
# job_name if omitted (arch from the convnext_*_ prefix; protocol = madry|trades|
# gradnorm|v1|dvd|baseline; eps from the name). Override explicitly when needed,
# e.g. a base/large arch (the job_name must carry the convnext_base_/large_ prefix).

config:
  models_root: /home/ashtomer/projects/ares/results/models
  # node: null means "any GPU group"; the topup loop fills rtx_pro_6000 + rtx6000.
  default_node: null
  default_priority: 100

experiments:
  # ---- 16 adversarially-trained convnext_small models (linf/l2 x eps x init) ----
  - {launcher: golan-trainmodels, job_name: linf_1_init1, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: linf_1_init2, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: linf_2_init1, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: linf_2_init2, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: linf_4_init1, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: linf_4_init2, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: linf_8_init1, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: linf_8_init2, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: l2_1_init1, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: l2_1_init2, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: l2_2_init1, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: l2_2_init2, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: l2_4_init1, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: l2_4_init2, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: l2_8_init1, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}
  - {launcher: golan-trainmodels, job_name: l2_8_init2, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}

  # ---- 1 clean baseline ----
  - {launcher: golan-trainmodels, job_name: baseline_init1, warmup_epochs: 0, linear_epochs: 0, plateau_epochs: 150}

  # ---- continuation example (eps_curriculum launcher) ----
  # source eps 4 -> target eps 8, warmup/ramp/fixed schedule, 40 epochs (warmup→ramp ends ep25→plateau)
  - {launcher: eps_curriculum, job_name: linf_cont4to8_init1, warmup_epochs: 4, linear_epochs: 21, plateau_epochs: 15}

  # ---- examples of other protocols / arches (uncomment & adapt when selected) ----
  # trades:   - {launcher: golan-trainmodels, job_name: l2trades_8_init1, plateau_epochs: 150}
  # gradnorm: - {launcher: golan-trainmodels, job_name: gradnorm_l2_8_init1, plateau_epochs: 150}
  # dvd:      - {launcher: golan-trainmodels, job_name: dvd_l2_8_init1, plateau_epochs: 150}
  # base arch (note the convnext_base_ prefix on job_name):
  #           - {launcher: golan-trainmodels, job_name: convnext_base_l2_8_init1, arch: convnext_base, plateau_epochs: 150}
